<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header" role="banner">
  <div class="container nav-container">
    <a href="{{ '/' | relative_url }}" class="site-brand">
      <img class="site-logo" src="{{ '/assets/img/logo.svg' | relative_url }}" alt="" width="32" height="32">
      <span class="site-title">{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      {% assign url = page.url %}
      <a href="{{ '/projects/' | relative_url }}"{% if url contains '/projects' %} class="is-active" aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/reports/' | relative_url }}"{% if url contains '/reports' %} class="is-active" aria-current="page"{% endif %}>Reports</a>
      <a href="{{ '/resources/' | relative_url }}"{% if url contains '/resources' %} class="is-active" aria-current="page"{% endif %}>Resources</a>
      <a href="{{ '/about/' | relative_url }}"{% if url contains '/about' %} class="is-active" aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>
