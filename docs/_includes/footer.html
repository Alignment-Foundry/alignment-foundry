<footer class="site-footer" role="contentinfo">
  <div class="container footer-grid">
    <div>
      <p class="footer-brand">{{ site.title }}</p>
      <p class="footer-tagline">{{ site.tagline }}</p>
    </div>
    <div>
      <p class="footer-heading">Connect</p>
      <ul class="footer-links">
        <li><a href="https://alexsmoy.com">alexsmoy.com</a></li>
        <li><a href="https://linkedin.com/in/alexsmoy">LinkedIn</a></li>
        <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
      </ul>
    </div>
    <div>
      <p class="footer-heading">Newsletter</p>
      <form class="embeddable-buttondown-form" action="https://buttondown.com/api/emails/embed-subscribe/alignment-foundry" method="post">
        <label for="bd-email-footer">Enter your email</label>
        <input type="email" name="email" id="bd-email-footer" />
        <input type="submit" value="Subscribe" />
        <p>
          <a href="https://buttondown.com/refer/alignment-foundry" target="_blank">Powered by Buttondown.</a>
        </p>
      </form>
    </div>
    <div>
      <p class="footer-heading">License</p>
      <p class="footer-fineprint">Code: <a href="https://opensource.org/licenses/MIT">MIT</a> · Content: <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a></p>
    </div>
  </div>
  <div class="container footer-meta">
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}. <span class="footer-creed">Lead with faith. Empower people. Transform through alignment.</span></p>
  </div>
</footer>
