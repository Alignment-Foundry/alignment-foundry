---
layout: default
---
<article class="container page">
  <header class="page-header reveal">
    <p class="page-eyebrow">{{ page.eyebrow | default: page.title }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="page-content">
    {{ content }}
  </div>
</article>
