name: Em dash policy

# Enforces the repo-wide ban on em dashes (see CLAUDE.md). Runs on every push
# and pull request, scanning all tracked text content.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-em-dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for em dashes in tracked content
        run: python3 .github/scripts/check_no_em_dash.py
